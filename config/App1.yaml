apiVersion: apps/v1   
kind: Deployment    
metadata:            
  name: app-one
  labels:        
    app: app-one   
spec:            
  replicas: 3    
  selector:       
    matchLabels: 
      app: app-one
  template:        
    metadata:    
      labels:    
        app: app-one
    spec:        
      containers:    
      - name: app-one
        image: wil42/playground:v2
        ports:
          - containerPort: 8888 

---

apiVersion: v1
kind: Service
metadata:
  name: app-one
spec:
  type: LoadBalancer
  ports:
  - port: 8888
    targetPort: 8888
  selector:
    app: app-one

---

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: playground-ui-ingress
  namespace: dev
spec:
  rules:
  - http:
      paths:
      - path: /config
        pathType: Prefix
        backend:
          service:
            name: app-one
            port:
              number: 8888
